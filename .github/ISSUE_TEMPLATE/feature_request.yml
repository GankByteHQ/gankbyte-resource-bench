name: Feature request
description: Suggest one focused improvement to Resource Bench
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: smallest-version
    attributes:
      label: What is the smallest useful version?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Privacy, compatibility, or licensing considerations
    validations:
      required: true
